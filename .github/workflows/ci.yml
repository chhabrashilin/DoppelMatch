name: ci

on:
  push:
  pull_request:

# CI only reads the repository; the upload of fuzz crash artifacts needs no extra scope.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "gcc release",       cxx: g++-14,     flags: "-DCMAKE_BUILD_TYPE=Release -DEXSIM_NATIVE=OFF -DEXSIM_WERROR=ON" }
          - { name: "clang release",     cxx: clang++-18, flags: "-DCMAKE_BUILD_TYPE=Release -DEXSIM_NATIVE=OFF -DEXSIM_WERROR=ON" }
          - { name: "asan + ubsan",      cxx: clang++-18, flags: "-DCMAKE_BUILD_TYPE=Debug -DEXSIM_SANITIZE=ON" }
          - { name: "thread sanitizer",  cxx: clang++-18, flags: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DEXSIM_TSAN=ON" }
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-18
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

      - name: real-data replay validates against exchange snapshots
        run: |
          ./build/exsim_mdreplay --in data/sample_btcusdt_30s.exmd | tee md.txt
          grep -q "BOOK RECONSTRUCTION VALIDATED" md.txt
          # the check must be able to fail: dropping level updates has to be detected
          ./build/exsim_mdreplay --in data/sample_btcusdt_30s.exmd --inject-drop 50 | grep -q "fault injection detected"

      - name: replay determinism across implementations
        if: matrix.name == 'gcc release'
        run: |
          ./build/exsim_gen --out flow.bin --messages 2000000
          for b in ref aos soa hybrid; do ./build/exsim_replay --in flow.bin --book $b | grep digest; done | sort -u | tee digests.txt
          test "$(wc -l < digests.txt)" -eq 1

      - name: pipeline digest equals replay digest
        if: matrix.name == 'gcc release' || matrix.name == 'thread sanitizer'
        run: |
          ./build/exsim_gen --out flow.bin --messages 1000000
          a=$(./build/exsim_replay --in flow.bin | awk '/^digest/ {print $2}')
          b=$(./build/exsim_pipeline --in flow.bin --warmup 0 | awk '/digest/ {print $4}')
          echo "replay=$a pipeline=$b"; test "$a" = "$b"

      - name: gateway end to end (TCP correctness, kill -9 recovery, torn journal tail)
        if: matrix.name == 'gcc release' || matrix.name == 'asan + ubsan'
        run: bash scripts/e2e_gateway.sh build

      - name: sessions end to end (maker reports, anonymous counterparties, exchange-assigned ids vs hash flooding)
        if: matrix.name == 'gcc release'
        run: python3 scripts/e2e_sessions.py build

      - name: replication end to end (multicast with loss, gap repair, kill -9 failover to the backup)
        if: matrix.name == 'gcc release' || matrix.name == 'asan + ubsan'
        run: bash scripts/e2e_replication.sh build

      - name: market data end to end (level-2 feed, gap recovery by snapshot, late joiner)
        if: matrix.name == 'gcc release' || matrix.name == 'asan + ubsan'
        run: bash scripts/e2e_marketdata.sh build

  ocaml:
    name: OCaml reference model and cross-language agreement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7  # v3
        with: { ocaml-compiler: "5.2" }
      - run: opam install -y dune ppx_expect ppx_inline_test qcheck-core
      - name: expect tests and property tests
        working-directory: ocaml
        run: opam exec -- dune runtest
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DEXSIM_NATIVE=OFF && cmake --build build --target exsim_difffeed
      - name: the C++ engine and the OCaml model emit identical events on 5M random commands
        run: opam exec -- bash scripts/ocaml_diff.sh build 20 250000
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: and on real data (the engine's exact input for 5 minutes of Coinbase BTC-USD)
        run: |
          pip install orjson && cmake --build build --target exsim_l3replay
          python scripts/fetch_coinbase_l3.py --date 2026-09-01 --minutes 5 --out l3raw && python scripts/l3conv.py l3raw sample.exl3
          opam exec -- bash scripts/ocaml_real.sh build sample.exl3

  coverage:
    name: code coverage (every test suite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 llvm-18
      - name: line and branch coverage of include/exsim and the gateway
        run: LLVM_SUFFIX=-18 bash scripts/coverage.sh build

  planted-bugs:
    name: planted bugs (the test suite must catch each one)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - run: python3 scripts/mutation_check.py --cxx g++-14

  fuzzing:
    name: fuzzing (libFuzzer with ASan and UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEXSIM_FUZZ=ON -DEXSIM_NATIVE=OFF
          cmake --build build --target fuzz_book fuzz_wire fuzz_journal
      - name: wire decoder, journal recovery and engine-vs-reference, 60 s each
        run: |
          mkdir -p crashes
          for t in wire journal book; do
            mkdir -p corpus/$t
            ./build/fuzz_$t -max_total_time=60 -print_final_stats=1 -artifact_prefix=crashes/ corpus/$t 2>&1 | grep -E "stat::number_of_executed_units|ERROR|fuzz_" || true
            test -z "$(ls crashes)"
          done
      - if: failure()
        uses: actions/upload-artifact@v6
        with: { name: fuzz-crashes, path: crashes/ }

  coinbase:
    name: engine reproduces real Coinbase matching
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install orjson && sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DEXSIM_NATIVE=OFF && cmake --build build --target exsim_l3replay
      - name: fetch the first 5 minutes of a day of BTC-USD order-by-order data (free from Tardis.dev)
        run: python scripts/fetch_coinbase_l3.py --date 2026-09-01 --minutes 5 --out l3raw && python scripts/l3conv.py l3raw sample.exl3
      - name: every order and every match must be reproduced exactly
        run: |
          ./build/exsim_l3replay --in sample.exl3 --check-every 20000 | tee r.txt
          grep -q "reproduced exactly.*(100.0000%)" r.txt
          grep -q "predicted exactly by the engine: .*(100.0000%)" r.txt
          grep -q "comparisons.*failed 0;" r.txt
      - name: the comparison must be able to fail (drop every 1000th cancel)
        run: |
          ./build/exsim_l3replay --in sample.exl3 --check-every 20000 --drop-cancels 1000 | tee f.txt || true
          ! grep -q "diverged: 0 " f.txt

  liquibook:
    name: agreement with Liquibook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - run: bash scripts/fetch_liquibook.sh third_party/liquibook
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release -DEXSIM_NATIVE=OFF -DEXSIM_LIQUIBOOK_DIR=$PWD/third_party/liquibook
      - run: cmake --build build --target exsim_bench_liquibook
      - name: both engines must produce the same trades and volume on identical input
        run: ./build/exsim_bench_liquibook --messages 1000000 --reps 1 | tee lb.txt && grep -q IDENTICAL lb.txt

  wasm:
    name: WebAssembly engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e  # v15
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: bash scripts/build_wasm.sh
      - run: node wasm/test_wasm.js
      - name: browser UI end to end (headless Chrome, real engine)
        run: python3 scripts/ui_e2e.py

  analysis:
    name: accounting audit of the committed study results
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install numpy pandas
      - name: recompute PnL, inventory and spread capture from raw fills and compare with the simulator
        run: |
          for g in results/*/grid.csv; do  # market-making runs only (results/ also holds the L3 studies)
            d=$(dirname "$g")
            python scripts/verify_accounting.py --results "$d" --dataset "$(basename "$d")"
          done
